
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman AI Video Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111b;
      color: white;
      text-align: center;
    }
    header { padding: 35px 15px; }
    h1 { color: #a78bfa; }
    main {
      max-width: 650px;
      margin: 20px auto;
      padding: 25px;
      background: #1d1e2b;
      border-radius: 16px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }
    button {
      margin-top: 15px;
      padding: 14px 25px;
      background: #8b5cf6;
      color: white;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 16px;
    }
    #preview {
      margin-top: 25px;
      background: white;
      color: black;
      min-height: 180px;
      border-radius: 12px;
      display: grid;
      place-items: center;
    }
    .stickman { font-size: 75px; }
  </style>
</head>
<body>
  <header>
    <h1>Stickman AI Studio</h1>
    <p>Turn your ideas into stickman stories!</p>
  </header>

  <main>
    <h2>Create Your Video</h2>
    <textarea id="prompt"
      placeholder="Describe your stickman story..."></textarea>
    <br>
    <button onclick="generate()">Generate Preview</button>
    <div id="preview">
      <div>
        <div class="stickman">🕴️</div>
        <p>Your preview will appear here.</p>
      </div>
    </div>
    <p id="status"></p>
  </main>

  <script>
    function generate() {
      const prompt = document.getElementById("prompt").value.trim();
      const preview = document.getElementById("preview");
      const status = document.getElementById("status");

      if (!prompt) {
        status.textContent = "Please enter your story first.";
        return;
      }

      preview.innerHTML =
        '<div><div class="stickman">🕴️</div><p>' +
        "Your story: " + escapeText(prompt) +
        '</p></div>';

      status.textContent =
        "Preview created! AI video generation will be added next.";
    }

    function escapeText(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
