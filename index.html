
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman AI Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111b;color:white;font-family:Arial;text-align:center}
header{padding:25px}
h1{color:#a78bfa}
main{max-width:850px;margin:15px auto;padding:20px}
textarea{width:100%;height:90px;padding:14px;border-radius:10px;font-size:16px}
button{padding:13px 20px;margin:10px 5px;border:0;border-radius:9px;background:#8b5cf6;color:white;cursor:pointer;font-size:15px}
button:hover{background:#7044d1}
canvas{width:100%;background:white;border-radius:12px;margin-top:18px}
#status{color:#c4b5fd}
</style>
</head>
<body>
<header>
<h1>Stickman AI Studio</h1>
<p>Turn your ideas into animated stickman stories.</p>
</header>
<main>
<h2>Create your story</h2>
<textarea id="prompt" placeholder="Example: A stickman walks through a beautiful city."></textarea>
<br>
<button onclick="generate()">Generate Animation</button>
<button onclick="downloadVideo()">Download Video</button>
<canvas id="scene" width="900" height="506"></canvas>
<p id="status">Enter a story to begin!</p>
</main>

<script>
const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");
let story="Your stickman story";
let start=performance.now();
let running=true;

function line(x1,y1,x2,y2){
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.stroke();
}

function draw(time){
 if(!running)return;
 const t=(time-start)/1000;
 ctx.clearRect(0,0,900,506);

 // Background
 ctx.fillStyle="#f5f3ff";
 ctx.fillRect(0,0,900,506);
 ctx.fillStyle="#ddd6fe";
 ctx.fillRect(0,390,900,116);

 // Title
 ctx.fillStyle="#25213b";
 ctx.font="bold 25px Arial";
 ctx.fillText("STICKMAN STORY",35,45);

 // Story caption
 ctx.font="20px Arial";
 ctx.fillStyle="#51466e";
 let caption=story.length>65?story.slice(0,62)+"...":story;
 ctx.fillText(caption,35,85);

 // Walking stickman
 const x=450+Math.sin(t*1.5)*100;
 const bounce=Math.abs(Math.sin(t*5))*9;
 const y=260+bounce;
 ctx.strokeStyle="#171717";
 ctx.lineWidth=9;
 ctx.lineCap="round";

 // Head
 ctx.beginPath();
 ctx.arc(x,y-90,27,0,Math.PI*2);
 ctx.stroke();

 // Body
 line(x,y-62,x,y+35);

 // Arms
 const arm=Math.sin(t*5)*25;
 line(x,y-40,x-38-arm,y+5);
 line(x,y-40,x+38+arm,y+5);

 // Legs
 const leg=Math.sin(t*5)*30;
 line(x,y+35,x-25-leg,y+110);
 line(x,y+35,x+25+leg,y+110);

 // Ground shadow
 ctx.fillStyle="#c4b5fd";
 ctx.beginPath();
 ctx.ellipse(x,380,45,9,0,0,Math.PI*2);
 ctx.fill();

 requestAnimationFrame(draw);
}

function generate(){
 const value=document.getElementById("prompt").value.trim();
 if(!value){
  document.getElementById("status").textContent="Please enter a story first.";
  return;
 }
 story=value;
 start=performance.now();
 document.getElementById("status").textContent="Your stickman animation is ready!";
}

function downloadVideo(){
 if(!canvas.captureStream || !window.MediaRecorder){
  document.getElementById("status").textContent="Video recording is not supported by this browser.";
  return;
 }

 const stream=canvas.captureStream(30);
 let options={};
 if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9")){
  options.mimeType="video/webm;codecs=vp9";
 }else if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8")){
  options.mimeType="video/webm;codecs=vp8";
 }

 let recorder;
 try{
  recorder=new MediaRecorder(stream,options);
 }catch(error){
  document.getElementById("status").textContent="Could not start video recording.";
  stream.getTracks().forEach(track=>track.stop());
  return;
 }

 const chunks=[];
 recorder.ondataavailable=e=>{
  if(e.data.size>0)chunks.push(e.data);
 };
 recorder.onstop=()=>{
  const blob=new Blob(chunks,{type:"video/webm"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download="my-stickman-video.webm";
  link.click();
  URL.revokeObjectURL(url);
  stream.getTracks().forEach(track=>track.stop());
  document.getElementById("status").textContent="Your video has been downloaded!";
 };

 recorder.start();
 document.getElementById("status").textContent="Recording your animation for 8 seconds...";
 setTimeout(()=>{
  if(recorder.state==="recording")recorder.stop();
 },8000);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
